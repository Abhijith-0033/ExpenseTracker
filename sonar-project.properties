# SonarCloud Configuration for ExpenseTracker
sonar.projectKey=ExpenseTracker
sonar.organization=expensetracker-org
sonar.projectName=ExpenseTracker
sonar.projectVersion=1.0.1

# Source Directories
sonar.sources=app,components,services,constants,context,hooks,src
sonar.tests=
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Encoding & Language Parameters
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions
sonar.exclusions=node_modules/**,.expo/**,android/**,ios/**,assets/**
